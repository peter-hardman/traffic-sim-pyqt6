[build-system]\nrequires = ["setuptools>=45", "wheel"]\nbuild-backend = "setuptools.build_meta"\n\n[project]\nname = "traffic-sim-pyqt6"\nversion = "0.1.0"\ndescription = "A traffic simulation with PyQt6 visualization and realistic vehicle physics"\nreadme = "README.md"\nrequires-python = ">=3.8"\nlicense = {text = "MIT"}\nauthors = [{name = "Peter Hardman"}]\nkeywords = ["traffic", "simulation", "pyqt6", "visualization"]\ndependencies = [\n    "PyQt6>=6.0.0",\n    "numpy>=1.20.0",\n]\n\n[project.optional-dependencies]\ndev = [\n    "pytest>=6.0",\n    "pytest-cov>=2.12.0",\n]\n\n[project.scripts]\ntraffic-sim = "traffic_sim.main:main"